[project]
name = "lab2-rest-api"
version = "0.1.0"
description = "Git lab REST service"
authors = [
    {name = "Dmytro Nezola", email = "nezola.dima2684@gmail.com"}
]
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "allure-pytest>=2.16.2",
    "requests==2.34.2"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
