name: Integration Tests (Newman & PostgreSQL)

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    # Налаштування служби PostgreSQL для тестів
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FastAPI application in background
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Зачекати кілька секунд, поки сервер запуститься
          sleep 3

      - name: Set up Node.js (for Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML reporter
        run: |
          npm install -g newman newman-reporter-html

      - name: Run Postman tests via Newman & generate HTML report
        run: |
          mkdir -p reports
          newman run postman/collection.json --reporters cli,html --reporter-html-export reports/integration-report.html

      - name: Upload HTML Test Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: reports/integration-report.html