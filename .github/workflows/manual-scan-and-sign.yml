name: Manual Scan and Sign Image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Версія образу (тег) для сканування та підпису (наприклад, latest або v1.0.9)'
        required: true
        default: 'latest'

jobs:
  scan-and-sign:
    runs-on: ubuntu-latest
    # Ці права потрібні для створення Keyless-підпису Cosign через GitHub
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================================
      # ЗАВДАННЯ 7: Сканування вказаної версії
      # ==========================================
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lyndorind/lab6-rest-api:${{ github.event.inputs.image_version }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v3
        with:
          image: 'lyndorind/lab6-rest-api:${{ github.event.inputs.image_version }}'
          fail-build: false

      - name: Run Snyk to check Docker image
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: 'lyndorind/lab6-rest-api:${{ github.event.inputs.image_version }}'
          args: --severity-threshold=high

      # ==========================================
      # ЗАВДАННЯ 8: Підписання (Cosign) та перевірка
      # ==========================================
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        run: |
          # Підписуємо образ і завантажуємо підпис на Docker Hub
          cosign sign --yes lyndorind/lab6-rest-api:${{ github.event.inputs.image_version }}

      - name: Verify the signature
        run: |
          # Перевіряємо валідність підпису
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            lyndorind/lab6-rest-api:${{ github.event.inputs.image_version }}

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          payload: |
            {
              "text": "Образ версії [ ${{ github.event.inputs.image_version }} ] проскановано, підписано Cosign та перевірено! Статус: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}