name: Load Testing & Monitoring

on:
  pull_request:
    branches: [ main ]

jobs:
  load-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]" psycopg2-binary httpx

      - name: Run FastAPI application in background
        env:
          DATABASE_URL: postgresql://postgres:supersecretpassword@localhost:5432/testdb
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run Load Test
        run: python load_test.py

      - name: Check Container Resource Usage
        run: docker stats --no-stream || true