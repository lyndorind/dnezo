name: Apache JMeter Load Test & Docker Monitoring

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare database secret
        run: printf '%s' 'supersecretpassword' > db_password.txt

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for API and check database
        run: |
          set -e
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/status >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:8000/status
          curl -fsS http://localhost:8000/db-test | tee db-test-response.json
          grep -q '"status":"success"' db-test-response.json

      - name: Install Apache JMeter 5.6.3
        run: |
          curl -fsSLo apache-jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter.tgz

      - name: Prepare test results
        run: |
          mkdir -p jmeter/results
          rm -rf jmeter/results/html-report
          rm -f jmeter/results/load-test.jtl

      - name: Run JMeter with Docker resource monitoring
        run: |
          set -e

          (
            while true; do
              echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}} MEM%={{.MemPerc}}'
              sleep 2
            done
          ) > jmeter/results/docker-stats.log 2>&1 &

          STATS_PID=$!

          set +e
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t jmeter/lab7-load-test.jmx \
            -l jmeter/results/load-test.jtl \
            -e \
            -o jmeter/results/html-report
          JMETER_EXIT=$?
          set -e

          kill "$STATS_PID" 2>/dev/null || true
          wait "$STATS_PID" 2>/dev/null || true

          docker stats --no-stream >> jmeter/results/docker-stats.log 2>&1 || true

          exit "$JMETER_EXIT"

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p jmeter/results
          docker compose logs --no-color > jmeter/results/docker-compose.log 2>&1 || true

      - name: Upload JMeter report and monitoring results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-load-test-results
          path: |
            jmeter/results/
            db-test-response.json
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v
